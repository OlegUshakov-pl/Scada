services:

  django:
    build:
      context: ./django_scada
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django_scada:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=scada
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=scada_dev_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  fastapi:
    build:
      context: ./fastapi_realtime
    command: uvicorn main:app --host 0.0.0.0 --port 9000 --reload
    volumes:
      - ./fastapi_realtime:/app
    ports:
      - "9000:9000"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  logic_engine:
    build:
      context: ./logic_engine
    command: python engine.py
    volumes:
      - ./logic_engine:/app
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - DJANGO_URL=http://django:8000
      - SCADA_API_TOKEN=${SCADA_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: timescale/timescaledb:latest-pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: scada_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scada"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
