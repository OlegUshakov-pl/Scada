<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Экраны — SCADA</title>
<style>body{font-family:sans-serif;background:#111;color:#eee;margin:24px}a{color:#60a5fa}</style>
</head>
<body>
<h1>Экраны</h1>
{% if screens %}
<ul>
{% for s in screens %}
  <li><b>{{ s.name }}</b> ({{ s.width }}×{{ s.height }}, {{ s.widgets|length }} виджетов)
    — <a href="/screens/{{ s.id }}/">дашборд</a>
    — <a href="/screens/{{ s.id }}/edit/">конструктор</a></li>
{% endfor %}
</ul>
{% else %}<p>Экранов нет. Создайте в <a href="/admin/scada/screen/">админке</a>.</p>{% endif %}
<p><a href="/admin/">← в админку</a></p>
</body>
</html>
